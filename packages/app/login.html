<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Miami Heat - Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/styles/reset.css" />
    <link rel="stylesheet" href="/styles/tokens.css">
    <link rel="stylesheet" href="/styles/page.css">

    <script type="module" src="/src/login.ts"></script>
</head>
<body class="page light-mode">
    <auth-provider>
            <h2>User Login</h2>
            <main class="card">
                <login-form api="/auth/login">
                    <label>
                        <span>Username:</span>
                        <input name="username" autocomplete="off" />
                    </label>
                    <label>
                        <span>Password:</span>
                        <input type="password" name="password" />
                    </label>
                </login-form>
            </main>
    </auth-provider>
</body>
</html>
