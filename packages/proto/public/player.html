<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Bam Adebayo - Player Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/page.css">
</head>
<body>
    <auth-provider>
        <heat-header></heat-header>

        <div class="page-container">
            <aside class="sidebar">
                <h3>Player Stats</h3>
                <ul>
                    <li>Position: Center</li>
                    <li>Height: 6'9"</li>
                    <li>PPG: 19.3</li>
                    <li>RPG: 10.4</li>
                </ul>
            </aside>

            <main class="content-area">
                <heat-card icon="icon-jersey">
                    <span slot="heading">Bam Adebayo (#13)</span>
                    <p slot="body">Bam Adebayo is a core player for the Miami Heat, known for his elite defense and playmaking ability.</p>
                </heat-card>

                <heat-card>
                    <span slot="heading">Recent Activity</span>
                    <p slot="body">Participates in: <a href="game.html">Game vs. Lakers</a></p>
                </heat-card>
            </main>
        </div>
    </auth-provider>
    <script type="importmap">
    {
        "imports": {
            "@unbndl/auth": "https://unpkg.com/@unbndl/auth",
            "@unbndl/html": "https://unpkg.com/@unbndl/html",
            "@unbndl/view": "https://unpkg.com/@unbndl/view"
        }
    }
    </script>
    <script type="module">
        import { define } from "@unbndl/html";
        import { Auth } from "@unbndl/auth";
        import { HeatCardElement } from "/scripts/components/heat-card.js";
        import { HeatHeaderElement } from "/scripts/components/heat-header.js";

        define({
            "auth-provider": Auth.Provider,
            "heat-header": HeatHeaderElement,
            "heat-card": HeatCardElement
        });
    </script>
</body>
</html>
