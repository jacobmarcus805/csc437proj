<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>2025-2026 Season - Miami Heat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/page.css">
</head>
<body>
    <auth-provider>
        <heat-header></heat-header>

        <div class="page-container">
            <aside class="sidebar">
                <h3>Season Overview</h3>
                <ul>
                    <li>Status: Active</li>
                    <li>Record: 42-20</li>
                    <li>Standing: 2nd in East</li>
                </ul>
            </aside>

            <main class="content-area">
                <heat-card icon="icon-calendar">
                    <span slot="heading">2025-2026 NBA Season</span>
                    <p slot="body">The Miami Heat are looking to secure a top playoff seed and make another deep run in the postseason.</p>
                </heat-card>

                <heat-card>
                    <span slot="heading">Season Schedule</span>
                    <ul slot="body">
                        <li><a href="game.html">October 25, 2025: vs. Lakers</a></li>
                        <li><a href="playoff-game.html">Post-Season Hub</a></li>
                    </ul>
                </heat-card>
            </main>
        </div>
    </auth-provider>
    <script type="importmap">
    {
        "imports": {
            "@unbndl/auth": "https://unpkg.com/@unbndl/auth",
            "@unbndl/html": "https://unpkg.com/@unbndl/html",
            "@unbndl/view": "https://unpkg.com/@unbndl/view"
        }
    }
    </script>
    <script type="module">
        import { define } from "@unbndl/html";
        import { Auth } from "@unbndl/auth";
        import { HeatCardElement } from "/scripts/components/heat-card.js";
        import { HeatHeaderElement } from "/scripts/components/heat-header.js";

        define({
            "auth-provider": Auth.Provider,
            "heat-header": HeatHeaderElement,
            "heat-card": HeatCardElement
        });
    </script>
</body>
</html>
